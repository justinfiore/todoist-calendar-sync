name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 25 build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run tests
        id: gradle-test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test --no-daemon 2>&1 | tee gradle-test-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish test results in check summary
        if: always()
        run: python3 .github/scripts/publish_test_summary.py app/build/test-results/test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/test/
            app/build/reports/tests/test/
            gradle-test-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle tests failed
        if: steps.gradle-test.outputs.exit_code != '0'
        run: exit 1
