plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.6'
    implementation 'org.apache.groovy:groovy-cli-picocli:5.0.6'
    implementation 'org.apache.groovy:groovy-json:5.0.6'
    implementation 'org.apache.groovy:groovy-xml:5.0.6'
    implementation 'org.apache.groovy:groovy-yaml:5.0.6'
    implementation 'com.networknt:json-schema-validator:1.0.86'

    implementation 'ch.qos.reload4j:reload4j:1.2.26'
    implementation 'org.slf4j:slf4j-reload4j:2.0.12'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-codec:commons-codec:1.21.0'
    // CalDAV4j requires the ical4j 3.x API; 3.2.19 is the newest compatible release.
    implementation 'org.mnode.ical4j:ical4j:3.2.19'
    implementation 'com.github.caldav4j:caldav4j:1.0.1'
    implementation 'javax.cache:cache-api:1.1.1'
    implementation 'org.ehcache:jcache:1.0.1'
    implementation 'com.google.api-client:google-api-client:2.8.1'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20260708-2.0.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.47.1'

    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.wiremock:wiremock:3.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('todoistcaldavsync.TodoistCalDavSync')
    applicationName = 'todoist-caldav-sync'
}

startScripts {
    doLast {
        def winScriptFile = file(getWindowsScript())
        winScriptFile.text = winScriptFile.text.replaceAll('set CLASSPATH=.*', 'set CLASSPATH=%APP_HOME%/lib/*')
    }
}
